# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node

name: Node.js CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:

    runs-on: self-hosted

    strategy:
      matrix:
        node-version: [18.x]
      # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'  # Cache npm dependencies

      - name: Install dependencies (offline preferred)
        run: |
          npm ci --cache .  # Use local cache first (if enabled)
          npm ci           # Install missing dependencies (if any)

      - name: Build the project
        run: npm run build --if-present

      - name: Analyze build time (optional)
        run: |
          # Use a tool like `time` to measure and log build time
          time npm run build --if-present
          # ... Upload build time data to a monitoring tool (if desired)
